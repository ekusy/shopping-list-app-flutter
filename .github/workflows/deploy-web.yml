name: Deploy Web (develop)

# develop へのマージで Web 版を Firebase Hosting にデプロイする（先行評価用途）。
on:
  push:
    branches: [develop]

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --pwa-strategy=offline-first
      # firebase-tools は GitHub runner の Node 24 上で googleapis への fetch が
      # "Premature close" で失敗する（OAuth トークン取得が落ちて認証エラーになる）。
      # Node 20 を用意し、その PATH 上で firebase-tools を実行させて回避する。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: household-shopping-list-f7c12
          channelId: live
          # 主因は上の Node 20 固定（runner の Node 24 で premature close）。
          # 併せて最後に成功実績のある版に固定しておく。Node 修正で安定後は
          # latest へ戻して良い。
          firebaseToolsVersion: '15.22.0'
