name: Deploy Web (develop)

# develop へのマージで Web 版を Firebase Hosting にデプロイする（先行評価用途）。
on:
  push:
    branches: [develop]

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --pwa-strategy=offline-first
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: household-shopping-list-f7c12
          channelId: live
          # firebase-tools 15.22.1〜15.22.3 は keep-alive HTTP エージェントの不具合で
          # 全 API 呼び出しが "premature close" → keep-alive 無しで自動リトライする。
          # release POST はサーバ側で成功後に接続断 → リトライが
          # 400 FAILED_PRECONDITION（既に current active version）となりデプロイが
          # 失敗扱いになる（実体は公開済み）。最後に成功した 15.22.0 に固定する。
          firebaseToolsVersion: '15.22.0'
